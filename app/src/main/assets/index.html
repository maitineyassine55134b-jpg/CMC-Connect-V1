<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CMC Connect – Prototype</title>
<style>
:root{
  --primary:#3BAAC6;--primary-dark:#2a8ca6;--primary-light:#e6f5f9;
  --text:#1f3a44;--muted:#6b8790;--bg:#f4f9fb;--card:#fff;
  --danger:#e5484d;--warn:#f5a524;--ok:#2fb67c;--violet:#7c5cf0;
  --radius:16px;--shadow:0 4px 18px rgba(30,90,110,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none}
h1,h2,h3,h4{line-height:1.25}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.row{display:flex;align-items:center;gap:10px}
.gap{gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.right{text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{border:2px solid var(--primary);color:var(--primary);background:#fff}
.btn-outline:hover{background:var(--primary-light)}
.btn-light{background:#fff;color:var(--primary)}
.btn-ghost{color:var(--primary);background:var(--primary-light)}
.btn-danger{background:#fdecec;color:var(--danger)}
.btn-sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn-block{width:100%}
.btn-google{background:#fff;border:1px solid #dadce0;color:#3c4043;width:100%;padding:12px 16px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn-google:hover{background:#f8f9fa}
.gicon{width:22px;height:22px;border-radius:50%;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#4285F4}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h4{margin-bottom:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--primary-light);color:var(--primary-dark)}
.badge.admin{background:#eee9ff;color:var(--violet)}
.badge.cours{background:#e7f8ef;color:#1b8a5a}
.badge.etab{background:#fff4e0;color:#b46b00}
.badge.clubs{background:#ffe9f1;color:#c2185b}
.badge.urgent{background:#fdecec;color:var(--danger)}
.badge.ok{background:#e7f8ef;color:#1b8a5a}
.badge.wait{background:#fff4e0;color:#b46b00}
.unread{border-left:4px solid var(--primary)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.section-head a{font-size:.9rem;font-weight:600}
.page-title{font-size:1.45rem;margin-bottom:4px}
.page-sub{color:var(--muted);margin-bottom:18px}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid #d6e6ec;border-radius:12px;background:#fff;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,170,198,.15)}
label{display:block;font-size:.88rem;font-weight:600;margin-bottom:6px;color:var(--text)}
.field{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr;gap:0 16px}
.progress{height:8px;background:#dfeef3;border-radius:999px;overflow:hidden}
.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#6fd0e6);border-radius:999px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.avatar.lg{width:84px;height:84px;font-size:1.8rem}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid #d6e6ec;font-size:.88rem;font-weight:600;white-space:nowrap;color:var(--muted)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);text-align:center}
.stat b{display:block;font-size:1.4rem;color:var(--primary)}
.stat span{font-size:.78rem;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qcard{background:#fff;border-radius:14px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:flex-start;font-weight:600;transition:.2s}
.qcard:hover{transform:translateY(-2px)}
.qicon{width:42px;height:42px;border-radius:12px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center}
.hero-card{background:linear-gradient(135deg,var(--primary),#2a8ca6);color:#fff;border-radius:20px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.hero-card .icon{width:56px;height:56px;opacity:.9}
.hero-card p{opacity:.9;font-size:.9rem}
.event{display:flex;gap:14px;align-items:flex-start}
.date-block{min-width:64px;background:var(--primary-light);color:var(--primary-dark);border-radius:12px;padding:8px;text-align:center;font-size:.8rem;font-weight:700}
.date-block b{display:block;font-size:1.3rem}
.empty{text-align:center;padding:30px;color:var(--muted)}
.timeline{display:flex;justify-content:space-between;margin-top:14px;font-size:.75rem;color:var(--muted)}
.timeline b{color:var(--text)}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eef4f6}
.list-item:last-child{border-bottom:none}
.toggle{position:relative;width:46px;height:26px;background:#cfdfe5;border-radius:999px;transition:.2s;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--primary)}
.toggle.on::after{transform:translateX(20px)}
/* Auth */
.auth{min-height:100vh;display:flex;flex-direction:column}
.auth-hero{background:var(--primary);color:#fff;padding:50px 24px 90px;text-align:center;position:relative;overflow:hidden}
.auth-hero h1{font-size:2.2rem;letter-spacing:1px;font-weight:800}
.auth-hero p{opacity:.95;margin-top:8px}
.slogan{display:inline-block;margin-top:22px;background:#fff;color:var(--primary);padding:10px 20px;border-radius:12px;font-weight:700;font-style:italic}
.auth-body{margin-top:-60px;padding:0 16px 40px;display:flex;justify-content:center}
.auth-card{background:#fff;border-radius:22px;box-shadow:0 10px 40px rgba(20,80,100,.15);padding:28px;width:100%;max-width:520px}
.auth-card h2{margin-bottom:6px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#e2ecf0}
.steps{display:flex;gap:8px;margin-bottom:20px}
.steps span{flex:1;height:6px;border-radius:999px;background:#dfeef3}
.steps span.on{background:var(--primary)}
.note{background:var(--primary-light);border-radius:12px;padding:12px 14px;font-size:.85rem;color:var(--primary-dark);display:flex;gap:10px;margin:14px 0}
/* Shell */
.shell{min-height:100vh;display:block}
.sidebar{display:none;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:250px;background:#fff;border-right:1px solid #e2ecf0;padding:22px 16px;gap:4px}
.brand{font-weight:800;color:var(--primary);font-size:1.25rem;letter-spacing:.5px;padding:0 8px 18px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:.72rem;letter-spacing:0}
.nav-link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;color:var(--muted);font-weight:600;position:relative;width:100%;text-align:left}
.nav-link:hover{background:var(--bg);color:var(--text)}
.nav-link.active{background:var(--primary-light);color:var(--primary-dark)}
.nav-link .dot{margin-left:auto;background:var(--danger);color:#fff;font-size:.7rem;padding:2px 7px;border-radius:999px}
.sidebar .user-chip{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;background:var(--bg);border-radius:14px}
.main{min-height:100vh;padding:0 0 100px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,249,251,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;border-bottom:1px solid #e2ecf0}
.topbar .mobile-brand{font-weight:800;color:var(--primary);letter-spacing:.5px}
.icon-btn{position:relative;width:42px;height:42px;border-radius:12px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--text)}
.icon-btn .count{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:.65rem;border-radius:999px;padding:2px 6px;font-weight:700}
.content{padding:18px;max-width:1100px;margin:0 auto}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e2ecf0;display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:30}
.bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);padding:4px 8px;border-radius:10px;min-width:56px;position:relative}
.bottom-nav button.active{color:var(--primary)}
.bottom-nav button.active .icon{stroke-width:2.5}
@media(min-width:960px){
  .sidebar{display:flex}
  .main{margin-left:250px}
  .bottom-nav{display:none}
  .topbar .mobile-brand{display:none}
  .main{padding-bottom:30px}
  .content{padding:28px 32px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .quick{grid-template-columns:repeat(4,1fr)}
  .form-grid{grid-template-columns:1fr 1fr}
  .auth-hero{padding:70px 24px 100px}
  .auth-hero h1{font-size:3rem}
  .auth-hero{min-height:380px}
}
/* Messages */
.chat-layout{display:grid;grid-template-columns:1fr;gap:14px}
.conv{background:#fff;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left}
.conv.active{outline:2px solid var(--primary)}
.chat-panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:460px;overflow:hidden}
.chat-head{padding:14px 16px;border-bottom:1px solid #eef4f6;display:flex;gap:12px;align-items:center}
.chat-body{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:420px;background:#f7fbfc}
.bubble{max-width:78%;padding:10px 14px;border-radius:14px;font-size:.92rem;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bubble.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.bubble.them{align-self:flex-start;border-bottom-left-radius:4px}
.bubble small{display:block;opacity:.7;font-size:.7rem;margin-bottom:2px}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid #eef4f6}
.chat-input input{border-radius:999px}
@media(min-width:900px){.chat-layout{grid-template-columns:340px 1fr}}
/* Overlay & toast */
.overlay{position:fixed;inset:0;background:rgba(15,40,50,.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;padding:0}
.modal{background:#fff;border-radius:22px 22px 0 0;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;animation:up .25s ease}
@media(min-width:700px){.overlay{align-items:center;padding:20px}.modal{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.account{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;width:100%;text-align:left;border:1px solid #eef4f6;margin-bottom:8px}
.account:hover{background:var(--primary-light)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 18px;border-radius:12px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.2);font-size:.9rem;animation:up .25s ease;max-width:90vw}
@media(min-width:960px){.toast{bottom:30px}}
.search{position:relative;margin-bottom:14px}
.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:44px;border-radius:999px}
.grid-2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:800px){.grid-2{grid-template-columns:1fr 1fr}}
.contact-line{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:.9rem;margin-top:6px}
.contact-line a{color:var(--primary);font-weight:600;word-break:break-all}
.switch-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef4f6}
.switch-row:last-child{border:none}
</style>
</head>

const go=p=>{location.hash="#"+p};
function toast(msg){
  const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}
function openModal(html){$("modal").innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}

const PUBLIC=["/","/connexion","/inscription"];
const APP_PAGES={
  "/accueil":{title:"Accueil",fn:pageHome},

  "/calendrier":{title:"Calendrier",fn:pageCalendrier},
  "/demarches":{title:"Mes démarches",fn:pageDemarches},
  "/annuaire":{title:"Annuaire",fn:pageAnnuaire},
  "/messages":{title:"Messages",fn:pageMessages},
  "/profil":{title:"Mon profil",fn:pageProfil}
};
function render(){
  const path=(location.hash||"#/").slice(1).split("?")[0]||"/";
  if(S.user && (path==="/"||path==="/connexion")){return go("/accueil")}
  if(!PUBLIC.includes(path) && !S.user){return go("/connexion")}
  if(PUBLIC.includes(path)){
    $("app").innerHTML = path==="/" ? pageWelcome() : path==="/connexion" ? pageLogin() : pageRegister();
  } else {
    const page=APP_PAGES[path]||APP_PAGES["/accueil"];
    $("app").innerHTML = shell(path,page);
  }
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);

  go("/accueil");
}

      <button class="btn btn-primary btn-block" type="submit">${ic('send')} Envoyer la demande</button>
    </form>
  `);
}
function submitDemarche(form){
  const f=Object.fromEntries(new FormData(form).entries());
  DEMARCHES.unshift({id:Date.now(),type:f.type,date:"27 oct. 2026",statut:"En attente",motif:f.motif||"—"});
  closeModal();toast("Demande envoyée ✔");render();
}

function pageAnnuaire(){
  return `
  <h1 class="page-title">Annuaire des services</h1>
  <p class="page-sub">Joignez rapidement le bon service ou le bon interlocuteur.</p>
  <div class="search">${ic('search')}<input placeholder="Rechercher un service…" value="${S.services}" oninput="S.services=this.value;drawServices()"></div>
  <div id="services" class="grid-2"></div>
  <script>drawServices()<\/script>
  `;
}
function drawServices(){
  const q=(S.services||"").toLowerCase();
  const box=$("services");if(!box)return;
  const list=SERVICES.filter(s=>(s.nom+s.resp).toLowerCase().includes(q));
  box.innerHTML=list.length?list.map(s=>`
    <article class="card" style="margin:0">
      <div class="row" style="margin-bottom:10px"><div class="qicon">${ic(s.icon)}</div><div class="grow"><h4 style="margin:0">${s.nom}</h4><p class="small muted">${s.resp}</p></div></div>
      <p class="small muted" style="margin-bottom:8px">${ic('clock')} ${s.horaires}</p>
      <div class="contact-line">${ic('phone')}<a href="tel:${s.tel.replace(/\s/g,'')}">${s.tel}</a></div>
      <div class="contact-line">${ic('mail')}<a href="mailto:${s.mail}">${s.mail}</a></div>
    </article>`).join(""):`<div class="empty" style="grid-column:1/-1">Aucun service trouvé.</div>`;
}

function pageMessages(){
  const c=CHATS.find(x=>x.id===S.chat)||CHATS[0];
  return `
  <h1 class="page-title">Mes échanges</h1>
  <p class="page-sub">Discutez avec vos formateurs et votre espace de filière.</p>
  <div class="chat-layout">
    <div>
      ${CHATS.map(x=>`
        <button class="conv ${x.id===c.id?'active':''}" onclick="S.chat=${x.id};render()">
          <div class="avatar" style="${x.id===0?'background:var(--violet)':''}">${x.id===0?ic('users').replace('class="icon','class="icon" style="width:20px;height:20px;color:#fff;" data-x="'):initials(x.nom)}</div>
          <div class="grow"><b>${x.nom}</b><div class="small muted">${x.sub}</div></div>
        </button>`).join("")}
      <div class="card small muted" style="margin-top:10px">${ic('info')} Les formateurs répondent généralement sous 24 h ouvrables.</div>
    </div>
    <div class="chat-panel">
      <div class="chat-head">
        <div class="avatar">${c.id===0?'G':initials(c.nom)}</div>
        <div><b>${c.nom}</b><div class="small muted">${c.sub}</div></div>
      </div>
      <div class="chat-body" id="chatBody">
        ${c.msgs.map(m=>`<div class="bubble ${m.me?'me':'them'}">${!m.me?`<small>${m.a}</small>`:''}${m.t}</div>`).join("")}
      </div>
      <form class="chat-input" onsubmit="event.preventDefault();sendChat(this)">
        <input name="m" placeholder="Écrire un message…" autocomplete="off" required>
        <button class="btn btn-primary" style="border-radius:999px;padding:10px 16px" type="submit">${ic('send')}</button>
      </form>
    </div>
  </div>`;
}
function sendChat(form){
  const v=form.m.value.trim();if(!v)return;
  const c=CHATS.find(x=>x.id===S.chat)||CHATS[0];
  c.msgs.push({me:true,a:"Moi",t:v});
  render();
  setTimeout(()=>{const b=$("chatBody");if(b)b.scrollTop=b.scrollHeight},0);
}

function pageProfil(){
  const u=S.user;
  const n=u.notif;
  return `
  <div class="card" style="text-align:center;padding:26px">
    <div class="avatar lg" style="margin:0 auto 12px">${initials(u.nom)}</div>
    <h2>${u.nom}</h2>
    <p class="muted">${u.email}</p>
    <div class="row wrap gap" style="justify-content:center;margin-top:12px">
      <span class="badge">${u.filiere}</span><span class="badge">${u.annee}</span><span class="badge">${u.region}</span>
    </div>
    <button class="btn btn-outline" style="margin-top:16px" onclick="openEditProfil()">${ic('edit')} Modifier mon profil</button>
  </div>
  <div class="card">
    <h4 style="margin-bottom:8px">Informations personnelles</h4>
    <div class="list-item"><div class="qicon">${ic('user')}</div><div class="grow"><div class="small muted">Tranche d’âge</div><b>${u.age}</b></div></div>
    <div class="list-item"><div class="qicon">${ic('pin')}</div><div class="grow"><div class="small muted">Région / zone</div><b>${u.region}</b></div></div>
    <div class="list-item"><div class="qicon">${ic('graduation')}</div><div class="grow"><div class="small muted">Filière & année</div><b>${u.filiere} · ${u.annee}</b></div></div>
    <div class="list-item"><div class="qicon">${ic('shield')}</div><div class="grow"><div class="small muted">Matricule</div><b>${u.matricule}</b></div></div>
    <div class="list-item"><div class="qicon">${ic('phone')}</div><div class="grow"><div class="small muted">Téléphone</div><b>${u.tel||'Non renseigné'}</b></div></div>
  </div>
  <div class="card">
    <h4 style="margin-bottom:6px">Notifications</h4>
    ${[["annonces","Nouvelles annonces"],["events","Rappels d’événements"],["admin","Démarches administratives"],["messages","Messages des formateurs"]].map(([k,l])=>`
      <div class="switch-row"><span>${l}</span><button class="toggle ${n[k]?'on':''}" onclick="toggleNotif('${k}')" aria-label="${l}"></button></div>`).join("")}
  </div>
  <div class="card">
    <button class="btn btn-danger btn-block" onclick="logout()">${ic('logout')} Se déconnecter</button>
  </div>
  `;
}
function toggleNotif(k){S.user.notif[k]=!S.user.notif[k];render()}
function logout(){S.user=null;S.google=null;toast("Vous êtes déconnecté");go("/")}
function openEditProfil(){
  const u=S.user;
  openModal(`
    <div class="modal-head"><h3>Modifier mon profil</h3><button class="icon-btn" style="width:36px;height:36px" onclick="closeModal()">${ic('x')}</button></div>
    <form onsubmit="event.preventDefault();saveEdit(this)">
      <div class="field"><label>Nom complet</label><input name="nom" value="${u.nom}" required></div>
      <div class="field"><label>Téléphone</label><input name="tel" value="${u.tel}" placeholder="06 XX XX XX XX"></div>
      <div class="field"><label>Filière</label><select name="filiere">${FILIERES.map(f=>`<option ${f===u.filiere?'selected':''}>${f}</option>`).join("")}</select></div>
      <div class="field"><label>Année</label><select name="annee"><option ${u.annee==='1ère année'?'selected':''}>1ère année</option><option ${u.annee==='2ème année'?'selected':''}>2ème année</option></select></div>
      <div class="field"><label>Région</label><select name="region">${REGIONS.map(r=>`<option ${r===u.region?'selected':''}>${r}</option>`).join("")}</select></div>
      <button class="btn btn-primary btn-block" type="submit">${ic('check')} Enregistrer</button>
    </form>
  `);
}
function saveEdit(form){
  const f=Object.fromEntries(new FormData(form).entries());
  Object.assign(S.user,f);closeModal();toast("Profil mis à jour ✔");render();
}

/* ============ DÉMARRAGE ============ */
render();
</script>
</body>
</html>
